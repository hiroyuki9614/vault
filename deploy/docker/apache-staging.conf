ServerName public-vault-staging
ServerTokens Prod
ServerSignature Off
TraceEnable Off

ProxyRequests Off
ProxyPreserveHost Off
ProxyAddHeaders On
ProxyTimeout 15

LimitRequestBody 1048576
LimitRequestFieldSize 8190
LimitRequestFields 100

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"

# Preserve the caller bearer token for the Node capability boundary, but replace
# any untrusted correlation id at the trusted Apache edge.
SetEnvIfNoCase Authorization "^(.+)$" VAULT_AUTHORIZATION=$1
RequestHeader set Authorization "%{VAULT_AUTHORIZATION}e" env=VAULT_AUTHORIZATION
RequestHeader set X-Request-ID "%{UNIQUE_ID}e"
RequestHeader set X-Forwarded-Proto "http"

ProxyPass        /health/live  http://vault-node:3100/health/live  connectiontimeout=2 timeout=5 retry=0
ProxyPassReverse /health/live  http://vault-node:3100/health/live

ProxyPass        /health/ready http://vault-node:3100/health/ready connectiontimeout=2 timeout=5 retry=0
ProxyPassReverse /health/ready http://vault-node:3100/health/ready

ProxyPass        /v1/ http://vault-node:3100/v1/ connectiontimeout=2 timeout=15 retry=0
ProxyPassReverse /v1/ http://vault-node:3100/v1/

DocumentRoot "/var/www/vault-empty"
<Directory "/var/www/vault-empty">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t \"%r\" %>s %b request_id=\"%{X-Request-ID}o\"" vault_combined
CustomLog /proc/self/fd/1 vault_combined
