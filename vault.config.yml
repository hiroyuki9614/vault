schema_version: 2

repository:
  full_name: hiroyuki9614/vault
  role: public_reference_implementation
  visibility_required: public

canonical:
  mutable_vault_data: supabase_postgresql
  github_repository_data_canonical: false
  document_identity: public.documents.id
  document_locator: public.documents.path

supabase:
  required: true
  auth_required: true
  rls_required: true
  project_ref_in_repository: forbidden
  secrets_in_repository: forbidden
  runtime_configuration:
    url: SUPABASE_URL
    public_key: SUPABASE_ANON_KEY
  semantic_rpcs:
    - public.get_document
    - public.put_document
    - public.delete_document

write_contract:
  optimistic_concurrency: true
  expected_version_required_for_update: true
  same_identity_readback: true

github:
  role: code_contract_migrations_templates_only
  user_data_storage: forbidden
  supabase_outage_write_fallback: forbidden

runtime:
  vps: external
  scheduler: external
  notifications: external
  control_plane: not_in_this_repository
