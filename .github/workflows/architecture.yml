name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked TypeScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck functional core and server runtime
        run: npm run typecheck

      - name: Test TypeScript runtime
        run: npm run test:ts

      - name: Build production runtime
        run: npm run build

      - name: Validate Apache reverse proxy configuration
        run: |
          set -euo pipefail
          sudo a2enmod ssl proxy proxy_http headers setenvif unique_id
          sudo install -d -o root -g root -m 0755 /var/www/vault-empty
          sudo cp deploy/apache/vault.conf.example /etc/apache2/sites-available/vault-ci.conf
          sudo sed -i 's#/etc/letsencrypt/live/vault.example.com/fullchain.pem#/etc/ssl/certs/ssl-cert-snakeoil.pem#' /etc/apache2/sites-available/vault-ci.conf
          sudo sed -i 's#/etc/letsencrypt/live/vault.example.com/privkey.pem#/etc/ssl/private/ssl-cert-snakeoil.key#' /etc/apache2/sites-available/vault-ci.conf
          sudo a2ensite vault-ci.conf
          sudo apachectl configtest

      - name: Smoke built loopback Node entrypoint
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: synthetic-ci-key
        run: |
          set -euo pipefail
          node dist/server/main.js >/tmp/vault-runtime.log 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health/live >/tmp/vault-health.json; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          grep -q '"status":"ok"' /tmp/vault-health.json

          kill -TERM "$pid"
          wait "$pid"
          trap - EXIT

      - name: Smoke Apache to Node reverse proxy boundary
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: synthetic-ci-key
        run: |
          set -euo pipefail
          node dist/server/main.js >/tmp/vault-runtime-apache.log 2>&1 &
          pid=$!
          cleanup() {
            sudo apachectl stop 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          node_ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health/live >/dev/null; then
              node_ready=1
              break
            fi
            sleep 0.1
          done
          test "$node_ready" -eq 1

          sudo apachectl start

          apache_ready=0
          for _ in $(seq 1 30); do
            if curl --insecure --fail --silent \
              --resolve vault.example.com:443:127.0.0.1 \
              --header 'X-Request-ID: attacker-controlled-request-id' \
              https://vault.example.com/health/live >/tmp/vault-apache-health.json; then
              apache_ready=1
              break
            fi
            sleep 0.1
          done
          test "$apache_ready" -eq 1
          grep -q '"status":"ok"' /tmp/vault-apache-health.json
          grep -q '"requestId":"' /tmp/vault-apache-health.json
          if grep -q 'attacker-controlled-request-id' /tmp/vault-apache-health.json; then
            echo 'Apache did not replace the untrusted X-Request-ID' >&2
            exit 1
          fi

          anonymous_status=$(curl --insecure --silent --output /tmp/vault-apache-anon.json --write-out '%{http_code}' \
            --resolve vault.example.com:443:127.0.0.1 \
            --request POST https://vault.example.com/v1/not-a-route \
            --header 'Content-Type: application/json' \
            --data '{}')
          test "$anonymous_status" = '401'
          grep -q '"error":"unauthenticated"' /tmp/vault-apache-anon.json

          authenticated_status=$(curl --insecure --silent --output /tmp/vault-apache-auth.json --write-out '%{http_code}' \
            --resolve vault.example.com:443:127.0.0.1 \
            --request POST https://vault.example.com/v1/not-a-route \
            --header 'Authorization: Bearer synthetic-ci-token' \
            --header 'Content-Type: application/json' \
            --data '{}')
          test "$authenticated_status" = '404'
          grep -q '"error":"not_found"' /tmp/vault-apache-auth.json

          sudo apachectl stop
          kill -TERM "$pid"
          wait "$pid"
          trap - EXIT

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test architecture checker
        run: python -m unittest tests/test_architecture_check.py

      - name: Check architecture
        run: python tooling/architecture_check.py

      - name: Test Apache proxy hardening checker
        run: python -m unittest tests/test_apache_proxy_check.py

      - name: Check Apache proxy hardening
        run: python tooling/apache_proxy_check.py

      - name: Test GitHub governance contract checker
        run: python -m unittest tests/test_github_governance_check.py

      - name: Check GitHub governance contract
        run: python tooling/github_governance_check.py

      - name: Test GitHub ruleset admin payload renderer
        run: python -m unittest tests/test_github_ruleset_admin_helper.py

      - name: Render GitHub ruleset admin payloads
        run: python tooling/github_ruleset_admin_helper.py --output-dir /tmp/vault-ruleset-payloads
