name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test architecture checker
        run: python -m unittest tests/test_architecture_check.py
      - name: Check architecture
        run: python tooling/architecture_check.py
