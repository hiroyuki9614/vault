name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked TypeScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck functional core and server runtime
        run: npm run typecheck

      - name: Test TypeScript runtime
        run: npm run test:ts

      - name: Build production runtime
        run: npm run build

      - name: Smoke built Nginx upstream entrypoint
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: synthetic-ci-key
        run: |
          set -euo pipefail
          node dist/server/main.js >/tmp/vault-runtime.log 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health/live >/tmp/vault-health.json; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          grep -q '"status":"ok"' /tmp/vault-health.json

          kill -TERM "$pid"
          wait "$pid"
          trap - EXIT

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test architecture checker
        run: python -m unittest tests/test_architecture_check.py

      - name: Check architecture
        run: python tooling/architecture_check.py
